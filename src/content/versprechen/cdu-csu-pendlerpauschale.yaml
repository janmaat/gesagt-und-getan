statusVoorstel: nagekomen
titel: Pendlerpauschale erhöhen
samenvatting: >-
  Seit dem 1. Januar 2026 gilt die Pendlerpauschale von 38 Cent ab dem ersten Kilometer dauerhaft.
  Vorher galten 30 Cent für die ersten 20 Kilometer.
citaat: "Wir erhöhen die Pendlerpauschale."
programma:
  pagina: 1
  pdfPagina: 3
  hoofdstuk: "Kurzfassung – Für ein neues Wohlstandsversprechen"
criterium: >-
  Umgesetzt, wenn die Entfernungspauschale (§ 9 Abs. 1 Satz 3 Nr. 4 EStG) per Gesetz über dem Stand
  vom Wahltag liegt, mindestens für einen Teil der Kilometer und nicht nur befristet.
  Teilweise umgesetzt bei einer nur befristeten Erhöhung. In Arbeit, wenn ein Gesetzentwurf vorliegt.
  Das Programm nennt keinen Betrag und kein Datum.
akkoord:
  oordeel: ja
  citaat: "Wir werden die Pendlerpauschale zum 01.01.2026 auf 38 Cent ab dem ersten Kilometer dauerhaft erhöhen."
  zeile: "1483–1485"
  pagina: 46
toelichting: >-
  Die Bundesregierung legte das Steueränderungsgesetz 2025 vor (Drucksache 21/1974). Darin steigt die
  Entfernungspauschale auf 38 Cent ab dem ersten Kilometer. Das Gesetz wurde mit Zustimmung des
  Bundesrates im Bundesgesetzblatt verkündet (BGBl. 2025 I Nr. 363). Die Änderung gilt seit dem
  1. Januar 2026. Für Strecken ab dem 21. Kilometer galten schon vorher 38 Cent, allerdings befristet.
kern: true
kernReden: >-
  Steht in der Kurzfassung vor dem ersten Kapitel (Vorspann), S. 1. Nr. 3 der ersten zehn prüfbaren Versprechen.
  Hinweis: Dass die Kurzfassung als Vorspann zählt, ist noch eine offene Entscheidung.

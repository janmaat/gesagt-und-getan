partij: gruene
kabinet: merz
thema: overheidsfinancien
status: onderzoek
statusVoorstel: deels
titel: Deutschlandfonds für Investitionen in Bund, Ländern und Kommunen
samenvatting: >-
  Ein Sondervermögen von bis zu 500 Milliarden Euro für Infrastruktur steht im Grundgesetz, davon 100 Milliarden
  Euro für die Länder. Der „Deutschlandfonds“ der Koalition ist ein anderes Instrument.
citaat: "Mit dem Deutschlandfonds werden wir in Bund, Ländern und Kommunen die notwendigen Mittel für die Investitionen in diese Zukunft mobilisieren."
programma:
  pagina: 10
  hoofdstuk: Präambel
criterium: >-
  Umgesetzt, wenn per Gesetz ein Investitionsfonds außerhalb des normalen Haushalts besteht, der Bund, Ländern
  und Kommunen Geld für Infrastruktur gibt. Teilweise umgesetzt, wenn es einen solchen Fonds mit anderem
  Aufbau oder ohne den Teil für Länder und Kommunen gibt.
akkoord:
  oordeel: aangepast
  citaat: "Wir werden einen Deutschlandfonds einrichten. Dieser ist das Dach, unter dem wir die Kraft der privaten Finanzmärkte mit dem langfristig strategischen Vorgehen des Investors Staat verbinden."
  zeile: "111–116"
  pagina: "4–5"
waaromAnders:
  reden: formatie
  zekerheid: aannemelijk
  bron: "Koalitionsvertrag, Zeilen 111–116: Der Deutschlandfonds der Koalition setzt auf privates Kapital, nicht auf einen öffentlichen Fonds für Länder und Kommunen."
  url: https://www.cdu.de/app/uploads/2025/04/Koalitionsvertrag-%E2%80%93-barrierefreie-Version.pdf
toelichting: >-
  Am 18. März 2025, noch im alten Bundestag, beschloss der Bundestag eine Änderung des Grundgesetzes (Art. 143h).
  Sie schafft ein Sondervermögen „mit einem Volumen von bis zu 500 Milliarden Euro“; 100 Milliarden Euro stehen
  den Ländern zur Verfügung. Die Grünen stimmten bis auf eine Abgeordnete zu. Kommunen haben im Grundgesetz
  keinen eigenen Anteil. Der „Deutschlandfonds“ der Bundesregierung startete im Dezember 2025 und ist laut
  Bundesregierung „weder um einen Staatsfonds noch um einen Fonds im finanzwirtschaftlichen Sinne“.
  Offene Frage für die Bewertung: Zählt ein ähnliches Instrument mit anderem Namen?
kern: true
kernReden: Steht in der Präambel (Vorspann), S. 10. Nr. 1 der prüfbaren Versprechen aus Vorspann und Kapitelanfängen.

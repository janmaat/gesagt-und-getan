kabinet: merz
thema: migratie
status: onderzoek
statusVoorstel: deels
titel: Turboeinbürgerung abschaffen
samenvatting: >-
  Die Einbürgerung nach drei Jahren ist seit dem 30. Oktober 2025 abgeschafft. Die anderen Teile des
  Versprechens (Bürgergeld und Bleiberechte für Ausreisepflichtige) sind noch nicht geprüft.
citaat: "Wir werden vollziehbar ausreisepflichtige Personen konsequent abschieben und bestehende Fehlanreize (Bürgergeld, Bleiberechte für Ausreisepflichtige, Turboeinbürgerung) abstellen."
programma:
  pagina: 101
  pdfPagina: 102
  hoofdstuk: "Asyl- und Migrationspolitik"
criterium: >-
  Für den Teil „Turboeinbürgerung“: umgesetzt, wenn die Möglichkeit, nach drei Jahren eingebürgert zu werden
  (§ 10 Abs. 3 StAG), per Gesetz gestrichen ist und das Gesetz gilt. Das ganze Versprechen gilt als umgesetzt,
  wenn auch die anderen genannten Teile umgesetzt sind.
akkoord:
  oordeel: aangepast
  citaat: "Wir schaffen die „Turboeinbürgerung“ nach drei Jahren ab."
  zeile: "3097–3098"
  pagina: 96
toelichting: >-
  Die Bundesregierung legte einen Gesetzentwurf zur Änderung des Staatsangehörigkeitsgesetzes vor
  (Drucksache 21/537). Der Bundestag nahm ihn am 8. Oktober 2025 in namentlicher Abstimmung an
  (450 Ja, 134 Nein, 2 Enthaltungen). Die Abgeordneten der AfD stimmten mit Ja, zwei enthielten sich.
  Das Gesetz steht im Bundesgesetzblatt (BGBl. 2025 I Nr. 256): „§ 10 Absatz 3 wird gestrichen.“
  Die übrigen Teile des Versprechens sind noch nicht geprüft.
kern: true
kernReden: Nr. 3 der ersten zehn prüfbaren Versprechen aus den Kapitelanfängen des Programms.

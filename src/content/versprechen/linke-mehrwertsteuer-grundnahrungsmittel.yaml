titel: Keine Mehrwertsteuer auf Grundnahrungsmittel
samenvatting: >-
  Nicht im Koalitionsvertrag. Einen Antrag der Linken dazu lehnte der Bundestag im September 2025 ab.
citaat: "Deshalb wollen wir die Mehrwertsteuer auf Grundnahrungsmittel abschaffen"
programma:
  pagina: 4
  hoofdstuk: Einleitung
criterium: Umgesetzt, wenn der Mehrwertsteuersatz auf Grundnahrungsmittel per Gesetz bei 0 Prozent liegt und das Gesetz gilt.
akkoord:
  oordeel: nee
toelichting: >-
  Der Koalitionsvertrag enthält dazu nichts; zur Umsatzsteuer steht dort nur die Senkung für Speisen in der
  Gastronomie auf sieben Prozent. Die Fraktion Die Linke stellte einen Antrag (Drucksache 21/135).
  Der Bundestag folgte am 12. September 2025 der Empfehlung des Finanzausschusses, den Antrag abzulehnen.
  Eine andere Umsetzung wurde nicht gefunden. Der aktuelle Wortlaut von § 12 UStG ist noch nicht geprüft.
kern: true
kernReden: Steht in der Einleitung (Vorspann), S. 4. Nr. 2 der ersten zehn prüfbaren Versprechen.

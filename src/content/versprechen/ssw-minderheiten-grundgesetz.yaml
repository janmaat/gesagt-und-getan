titel: Schutz der Minderheiten ins Grundgesetz
samenvatting: >-
  Nicht im Koalitionsvertrag. Das Bundesinnenministerium hat im März 2026 entschieden, keine Grundgesetzänderung vorzubereiten.
citaat: "Wir wollen eine Aufnahme des Schutzes und der Förderung der Minderheiten ins Grundgesetz."
programma:
  pagina: 6
  hoofdstuk: "Gute Minderheitenpolitik ist Friedenspolitik"
criterium: >-
  Umgesetzt, wenn das Grundgesetz eine Bestimmung zum Schutz oder zur Anerkennung der nationalen Minderheiten erhält.
  In Arbeit, wenn ein Gesetzentwurf vorliegt.
akkoord:
  oordeel: nee
  citaat: "Wir bekennen uns zu Schutz und Förderung der in Deutschland lebenden nationalen Minderheiten."
  zeile: "2741"
  pagina: 85
toelichting: >-
  Der Koalitionsvertrag bekennt sich zum Schutz der nationalen Minderheiten, sieht aber keine Änderung des
  Grundgesetzes vor. Der Bundesrat forderte am 26. September 2025 in einer Entschließung, die Minderheiten ins
  Grundgesetz aufzunehmen. Das Bundesinnenministerium entschied am 19. März 2026, „keine Grundgesetzänderung …
  vorzubereiten“. Ein Gesetzentwurf im Bundestag wurde nicht gefunden.
kern: true
kernReden: Nr. 1 der ersten zehn prüfbaren Versprechen aus Vorspann und Kapitelanfängen, S. 6.

partij: linke
gezaehlt: "Mindestens etwa 42 prüfbare Versprechen; nicht vollständig gezählt. Mehrere Kapitel haben keine Zwischenüberschriften und zählen ganz als Kapitelanfang. Die ersten zehn stehen fest."
kandidaten:
